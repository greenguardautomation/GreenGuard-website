<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<meta name="robots" content="noindex, nofollow">

<!-- =====================================================================
     QR CODE REDIRECT  —  greenguardautomation.com/e1

     The printed QR code points at /e1 and must NEVER change. This file is
     what /e1 sends people to, and it can be changed as often as you like.

     TO CHANGE WHERE THE QR CODE LEADS:
       edit the URL in the TWO places marked "TARGET" below, commit, push.
       Live in about a minute.

     Deliberately NOT an HTTP 301: browsers cache a 301 permanently, so
     anyone who had already scanned the code would keep landing on the old
     destination forever, even after this file changed.
     ===================================================================== -->

<script>
  // TARGET (1 of 2)
  var TARGET = "https://greenguardautomation.com/reserve.html";
  window.location.replace(TARGET);
</script>
<noscript>
  <!-- TARGET (2 of 2) — only used if JavaScript is off -->
  <meta http-equiv="refresh" content="0; url=https://greenguardautomation.com/reserve.html">
</noscript>

<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
       font-family:Helvetica,Arial,sans-serif;background:#ffffff;color:#4A5A4A;
       font-size:15px;text-align:center;padding:24px}
  a{color:#0C3311}
</style>
</head>
<body>
  <p>Redirecting to <a id="fallback" href="https://greenguardautomation.com/reserve.html">greenguardautomation.com/reserve</a>…</p>
  <script>
    // Keep the visible fallback link in sync with TARGET, so there is only
    // ever one URL to edit for the JavaScript path.
    document.getElementById("fallback").href = TARGET;
  </script>
</body>
</html>
